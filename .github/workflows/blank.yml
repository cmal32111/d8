name: Build V8 d8
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - name: Setup depot_tools
      shell: powershell
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fetch V8
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        mkdir C:\src
        cd C:\src
        fetch.bat v8

    - name: Build d8
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0

        # Detect available Windows SDK (runner has 10.0.26100.x, NOT 10.0.28000.x)
        $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include"
        $sdkVer = (Get-ChildItem $sdkDir |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object Name -Descending |
          Select-Object -First 1).Name
        Write-Host "Detected Windows SDK: $sdkVer"

        cd C:\src\v8
        $outDir = "out\x64.release"

        # Use gn directly with win_sdk_version override
        # This passes the SDK version to vcvarsall.bat, bypassing the missing 10.0.28000
        $gnArgs = "is_debug=false target_cpu=`"x64`" win_sdk_version=`"$sdkVer`""
        Write-Host "GN args: $gnArgs"
        gn.bat gen $outDir "--args=$gnArgs"

        # Build d8
        autoninja.bat -C $outDir d8

    - name: Upload d8
      uses: actions/upload-artifact@v4
      with:
        name: d8-win-x64
        path: C:\src\v8\out\x64.release\d8.exe
