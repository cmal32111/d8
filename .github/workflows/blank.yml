name: Build V8 d8
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - name: depot_tools
      shell: powershell
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: fetch v8
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        mkdir C:\src; cd C:\src
        fetch.bat v8

    - name: Install Windows SDK 10.0.28000
      shell: powershell
      run: |
        Write-Host "Installing Windows SDK 10.0.28000..."
        winget install --id Microsoft.WindowsSDK.10.0.28000 --exact `
          --accept-source-agreements --accept-package-agreements --silent
        # Wait for SDK to be fully installed
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0"
        $timeout = 120
        $elapsed = 0
        while (-not (Test-Path $sdkPath) -and $elapsed -lt $timeout) {
          Start-Sleep -Seconds 5
          $elapsed += 5
          Write-Host "Waiting for SDK... ($elapsed s)"
        }
        if (Test-Path $sdkPath) {
          Write-Host "SDK installed successfully: $sdkPath"
        } else {
          Write-Error "SDK installation failed or timed out"
          exit 1
        }

    - name: build d8
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        cd C:\src\v8
        vpython3.bat tools\dev\gm.py x64.release d8

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: d8-win-x64
        path: C:\src\v8\out\x64.release\d8.exe
